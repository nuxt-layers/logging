name: Quality
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['26.13.0', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm exec --yes --package=corepack@0.36.0 -- corepack pnpm install --frozen-lockfile
      - run: npm exec --yes --package=corepack@0.36.0 -- corepack pnpm typecheck
      - run: npm exec --yes --package=corepack@0.36.0 -- corepack pnpm test
      - run: node scripts/check-contract.mjs
      - run: node scripts/check-composition.mjs
      - name: Test isolated packaged consumer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logging-consumer/node_modules/@nuxt-layers/logging"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/logging-consumer/node_modules/@nuxt-layers/logging"
          cp tests/integration/consumer.test.ts "$RUNNER_TEMP/logging-consumer/consumer.test.ts"
          cd "$RUNNER_TEMP/logging-consumer"
          node --test consumer.test.ts
